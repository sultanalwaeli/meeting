<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة رصد أبو الدرداء</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#182338}
.app{max-width:850px;margin:auto;min-height:100vh;padding:18px}
.header,.card{background:white;border-radius:22px;padding:19px;box-shadow:0 8px 28px rgba(21,41,72,.07);margin-bottom:14px}
.header h1{margin:0 0 5px;font-size:25px}
.muted{color:#667085;font-size:14px}
label{display:block;font-weight:700;margin-bottom:7px}
input,select,textarea{width:100%;border:1px solid #d6dce6;border-radius:13px;padding:13px 14px;font-size:16px;background:#fff}
textarea{min-height:120px;resize:vertical}
.field{margin-bottom:14px}
button{border:0;border-radius:13px;padding:11px 15px;font-size:14px;font-weight:700;cursor:pointer}
.primary{background:#173f73;color:white}
.secondary{background:#edf2f8;color:#173f73}
.full{width:100%}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.record{text-align:right;background:#fff;border:1px solid #e2e8f0;padding:17px;border-radius:17px}
.record strong{display:block;font-size:17px;margin-bottom:6px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.status{padding:11px 13px;border-radius:11px;margin-bottom:12px;font-size:14px}
.ok{background:#ecfdf3;color:#067647}
.err{background:#fef3f2;color:#b42318}
.student{padding:15px 0;border-bottom:1px solid #edf0f4}
.student:last-child{border-bottom:0}
.student-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.student-name{font-size:16px;font-weight:700}
.actions{display:flex;gap:7px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{background:#f2f4f7;color:#475467;border-radius:999px;padding:5px 9px;font-size:12px}
.badge.done{background:#ecfdf3;color:#067647;font-weight:700}
.note-badge{background:#fff7ed;color:#9a3412}
.modal{position:fixed;inset:0;background:rgba(24,35,56,.58);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.modal-box{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:20px;padding:19px}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.existing{padding:10px 12px;background:#f8fafc;border-radius:11px;margin-bottom:12px;font-size:14px}
.bulk-row{display:grid;grid-template-columns:1fr 105px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf0f4}
.empty{text-align:center;color:#667085;padding:24px}
@media(max-width:580px){
 .grid{grid-template-columns:1fr}
 .student-head{align-items:flex-start;flex-direction:column}
 .actions{width:100%}
 .actions button{flex:1}
}
</style>
</head>
<body>
<div class="app">

<div class="header">
  <h1>منصة رصد أبو الدرداء</h1>
  <div class="muted">رصد الدرجات والملاحظات ومراجعة الرصد السابق</div>
</div>

<div id="status"></div>

<section id="loginView" class="card">
  <div class="field">
    <label>الرقم الوظيفي</label>
    <input id="employeeId" inputmode="numeric" autocomplete="username">
  </div>
  <div class="field">
    <label>PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
  </div>
  <button class="primary full" onclick="login()">دخول</button>
</section>

<section id="recordsView" class="hidden">
  <div class="card">
    <div class="topline">
      <div>
        <strong id="teacherName"></strong>
        <div class="muted">اختر الصف والشعبة</div>
      </div>
      <button class="secondary" onclick="logout()">خروج</button>
    </div>
  </div>
  <div id="recordsGrid" class="grid"></div>
</section>

<section id="studentsView" class="hidden">
  <div class="card">
    <div class="topline">
      <div>
        <strong id="recordTitle"></strong>
        <div id="recordSub" class="muted"></div>
      </div>
      <button class="secondary" onclick="backToRecords()">رجوع</button>
    </div>

    <div class="toolbar">
      <button class="primary" onclick="openBulk()">رصد جماعي</button>
      <button class="secondary" onclick="refreshStudents()">تحديث البيانات</button>
    </div>

    <div class="field">
      <input id="searchStudent" placeholder="ابحث باسم الطالب..." oninput="renderStudents()">
    </div>

    <div id="studentsList"></div>
  </div>
</section>

</div>

<div id="gradeModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="gradeStudent"></h3>

    <div id="gradeExisting" class="existing"></div>

    <div class="field">
      <label>أداة التقويم</label>
      <select id="toolSelect" onchange="syncExistingGrade()"></select>
    </div>

    <div class="field">
      <label>الدرجة</label>
      <input id="gradeValue" type="number" step="any" inputmode="decimal">
    </div>

    <div class="modal-actions">
      <button class="primary" onclick="saveGrade()">حفظ / تحديث</button>
      <button class="secondary" onclick="closeModal('gradeModal')">إلغاء</button>
    </div>
  </div>
</div>

<div id="noteModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="noteStudent"></h3>

    <div class="field">
      <label>الملاحظة</label>
      <textarea id="noteValue" placeholder="اكتب الملاحظة..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="primary" onclick="saveNote()">حفظ / تحديث</button>
      <button class="secondary" onclick="closeModal('noteModal')">إلغاء</button>
    </div>
  </div>
</div>

<div id="bulkModal" class="modal hidden">
  <div class="modal-box">
    <h3>الرصد الجماعي</h3>

    <div class="field">
      <label>أداة التقويم</label>
      <select id="bulkToolSelect" onchange="renderBulkRows()"></select>
    </div>

    <div class="existing">
      الدرجات السابقة تظهر داخل الحقول ويمكن تعديلها مباشرة.
    </div>

    <div id="bulkRows"></div>

    <div class="modal-actions">
      <button class="primary" onclick="saveBulk()">حفظ الجميع</button>
      <button class="secondary" onclick="closeModal('bulkModal')">إلغاء</button>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzef-RSjJy2rPomlW6jMi8kcVAen8GuQm9fCv6qvHmYeaZDzxBGlLbeXr-pP5w5PJZgMw/exec';

let session = {
  employeeId: "",
  pin: "",
  teacher: "",
  records: [],
  currentRecord: null,
  students: [],
  tools: [],
  selectedStudent: null
};

function setStatus(message, type = "ok") {
  document.getElementById("status").innerHTML =
    message ? `<div class="status ${type}">${message}</div>` : "";
}

async function api(data) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(data)
  });

  return await response.json();
}

async function login() {
  const employeeId = document.getElementById("employeeId").value.trim();
  const pin = document.getElementById("pin").value.trim();

  if (!employeeId || !pin) {
    return setStatus("أدخل الرقم الوظيفي وPIN.", "err");
  }

  setStatus("جاري التحقق...");

  try {
    const data = await api({
      action: "login",
      employeeId,
      pin
    });

    if (!data.success) {
      return setStatus(data.message || "تعذر تسجيل الدخول.", "err");
    }

    session.employeeId = employeeId;
    session.pin = pin;
    session.teacher = data.teacher || "";
    session.records = data.records || [];

    document.getElementById("teacherName").textContent =
      "مرحبًا " + session.teacher;

    renderRecords();

    document.getElementById("loginView").classList.add("hidden");
    document.getElementById("recordsView").classList.remove("hidden");

    setStatus("");

  } catch (error) {
    setStatus("تعذر الاتصال بالخدمة.", "err");
  }
}

function renderRecords() {
  const grid = document.getElementById("recordsGrid");
  grid.innerHTML = "";

  session.records.forEach((record, index) => {
    const button = document.createElement("button");
    button.className = "record";

    button.innerHTML = `
      <strong>${record.subject || ""}</strong>
      <div>${record.grade || ""} / شعبة ${record.className || ""}</div>
      <div class="muted">${record.sheetName || ""}</div>
    `;

    button.onclick = () => openRecord(index);
    grid.appendChild(button);
  });
}

async function openRecord(index) {
  session.currentRecord = session.records[index];

  document.getElementById("recordTitle").textContent =
    `${session.currentRecord.subject} - ${session.currentRecord.grade} / ${session.currentRecord.className}`;

  document.getElementById("recordSub").textContent =
    `المعلم: ${session.teacher}`;

  setStatus("جاري تحميل الطلاب وأدوات التقويم...");

  try {
    await loadStudents();

    document.getElementById("recordsView").classList.add("hidden");
    document.getElementById("studentsView").classList.remove("hidden");

    renderStudents();
    setStatus("");

  } catch (error) {
    setStatus(error.message || "تعذر تحميل السجل.", "err");
  }
}

async function loadStudents() {
  const data = await api({
    action: "students",
    employeeId: session.employeeId,
    pin: session.pin,
    sheetName: session.currentRecord.sheetName
  });

  if (!data.success) {
    throw new Error(data.message || "تعذر تحميل السجل");
  }

  session.students = data.students || [];
  session.tools = data.tools || [];
}

function renderStudents() {
  const query =
    (document.getElementById("searchStudent").value || "")
      .trim()
      .toLowerCase();

  const list = document.getElementById("studentsList");
  list.innerHTML = "";

  const filtered = session.students.filter(student =>
    String(student.name).toLowerCase().includes(query)
  );

  if (!filtered.length) {
    list.innerHTML = `<div class="empty">لا توجد نتائج.</div>`;
    return;
  }

  filtered.forEach(student => {
    const item = document.createElement("div");
    item.className = "student";

    const badges = (student.grades || [])
      .map(grade =>
        `<span class="badge ${grade.value !== "" ? "done" : ""}">
          ${grade.name}: ${grade.value !== "" ? grade.value : "—"}
        </span>`
      )
      .join("");

    const noteBadge = student.note
      ? `<span class="badge note-badge">ملاحظة موجودة</span>`
      : "";

    item.innerHTML = `
      <div class="student-head">
        <div class="student-name">${student.name}</div>

        <div class="actions">
          <button class="primary">درجة</button>
          <button class="secondary">ملاحظة</button>
        </div>
      </div>

      <div class="badges">
        ${badges}
        ${noteBadge}
      </div>
    `;

    const buttons = item.querySelectorAll("button");

    buttons[0].onclick = () => openGrade(student);
    buttons[1].onclick = () => openNote(student);

    list.appendChild(item);
  });
}

function fillTools(selectId) {
  const select = document.getElementById(selectId);
  select.innerHTML = "";

  session.tools.forEach(tool => {
    const option = document.createElement("option");
    option.value = tool.column;
    option.textContent = tool.name;
    select.appendChild(option);
  });
}

function openGrade(student) {
  session.selectedStudent = student;

  document.getElementById("gradeStudent").textContent =
    student.name;

  fillTools("toolSelect");

  if (!session.tools.length) {
    document.getElementById("gradeExisting").textContent =
      "لم يتم اكتشاف أي أداة تقويم في هذا السجل.";
    document.getElementById("gradeValue").value = "";
  } else {
    syncExistingGrade();
  }

  document.getElementById("gradeModal").classList.remove("hidden");
}

function syncExistingGrade() {
  const column = Number(
    document.getElementById("toolSelect").value
  );

  const grade = (session.selectedStudent.grades || [])
    .find(item => Number(item.column) === column);

  const value = grade ? grade.value : "";

  document.getElementById("gradeValue").value = value;

  document.getElementById("gradeExisting").textContent =
    value !== ""
      ? "الدرجة المرصودة حاليًا: " + value
      : "لم تُرصد درجة لهذا البند بعد.";
}

function openNote(student) {
  session.selectedStudent = student;

  document.getElementById("noteStudent").textContent =
    student.name;

  document.getElementById("noteValue").value =
    student.note || "";

  document.getElementById("noteModal").classList.remove("hidden");
}

async function saveGrade() {
  if (!session.tools.length) return;

  const column = Number(
    document.getElementById("toolSelect").value
  );

  const grade =
    document.getElementById("gradeValue").value;

  if (grade === "") {
    return alert("أدخل الدرجة");
  }

  try {
    const data = await api({
      action: "saveGrade",
      employeeId: session.employeeId,
      pin: session.pin,
      sheetName: session.currentRecord.sheetName,
      row: session.selectedStudent.row,
      column,
      grade
    });

    if (!data.success) {
      return setStatus(data.message || "تعذر الحفظ.", "err");
    }

    const oldGrade = (session.selectedStudent.grades || [])
      .find(item => Number(item.column) === column);

    if (oldGrade) {
      oldGrade.value = String(grade);
    }

    closeModal("gradeModal");
    renderStudents();

    setStatus("تم حفظ الدرجة بنجاح.");

  } catch (error) {
    setStatus("تعذر حفظ الدرجة.", "err");
  }
}

async function saveNote() {
  const note =
    document.getElementById("noteValue").value.trim();

  if (!note) {
    return alert("اكتب الملاحظة");
  }

  try {
    const data = await api({
      action: "saveNote",
      employeeId: session.employeeId,
      pin: session.pin,
      sheetName: session.currentRecord.sheetName,
      row: session.selectedStudent.row,
      note
    });

    if (!data.success) {
      return setStatus(data.message || "تعذر الحفظ.", "err");
    }

    session.selectedStudent.note = note;

    closeModal("noteModal");
    renderStudents();

    setStatus("تم حفظ الملاحظة بنجاح.");

  } catch (error) {
    setStatus("تعذر حفظ الملاحظة.", "err");
  }
}

function openBulk() {
  if (!session.tools.length) {
    return setStatus(
      "لم يتم اكتشاف أدوات تقويم في هذا السجل.",
      "err"
    );
  }

  fillTools("bulkToolSelect");
  renderBulkRows();

  document.getElementById("bulkModal").classList.remove("hidden");
}

function renderBulkRows() {
  const column = Number(
    document.getElementById("bulkToolSelect").value
  );

  const container = document.getElementById("bulkRows");
  container.innerHTML = "";

  session.students.forEach(student => {
    const current = (student.grades || [])
      .find(item => Number(item.column) === column);

    const value = current ? current.value : "";

    const row = document.createElement("div");
    row.className = "bulk-row";

    row.innerHTML = `
      <div>${student.name}</div>
      <input
        type="number"
        step="any"
        inputmode="decimal"
        data-row="${student.row}"
        value="${value}"
        placeholder="الدرجة"
      >
    `;

    container.appendChild(row);
  });
}

async function saveBulk() {
  const column = Number(
    document.getElementById("bulkToolSelect").value
  );

  const inputs = [
    ...document.querySelectorAll("#bulkRows input")
  ];

  const grades = inputs
    .filter(input => input.value !== "")
    .map(input => ({
      row: Number(input.dataset.row),
      grade: input.value
    }));

  if (!grades.length) {
    return alert("أدخل درجة واحدة على الأقل");
  }

  try {
    const data = await api({
      action: "saveBulkGrades",
      employeeId: session.employeeId,
      pin: session.pin,
      sheetName: session.currentRecord.sheetName,
      column,
      grades
    });

    if (!data.success) {
      return setStatus(data.message || "تعذر الحفظ.", "err");
    }

    closeModal("bulkModal");

    await loadStudents();
    renderStudents();

    setStatus(data.message || "تم حفظ الدرجات.");

  } catch (error) {
    setStatus("تعذر حفظ الدرجات.", "err");
  }
}

async function refreshStudents() {
  setStatus("جاري تحديث البيانات...");

  try {
    await loadStudents();
    renderStudents();
    setStatus("تم تحديث البيانات.");
  } catch (error) {
    setStatus(error.message || "تعذر تحديث البيانات.", "err");
  }
}

function closeModal(id) {
  document.getElementById(id).classList.add("hidden");
}

function backToRecords() {
  document.getElementById("studentsView").classList.add("hidden");
  document.getElementById("recordsView").classList.remove("hidden");

  session.currentRecord = null;
  session.students = [];
  session.tools = [];
  session.selectedStudent = null;

  setStatus("");
}

function logout() {
  session = {
    employeeId: "",
    pin: "",
    teacher: "",
    records: [],
    currentRecord: null,
    students: [],
    tools: [],
    selectedStudent: null
  };

  document.getElementById("recordsView").classList.add("hidden");
  document.getElementById("studentsView").classList.add("hidden");
  document.getElementById("loginView").classList.remove("hidden");

  document.getElementById("employeeId").value = "";
  document.getElementById("pin").value = "";

  setStatus("");
}
</script>
</body>
</html>
